# NARAN — production stack for a single VPS (Dokploy / Coolify / plain compose).
#
# Values are interpolated from an `.env` file placed NEXT TO this file
# (infra/.env — see infra/.env.prod.example). Secrets never live in git.
#
# Dokploy: create a "Docker Compose" app pointing at this file, then assign
# public domains (with TLS) to the `web`, `medusa`, and `api` services in the UI
# — Dokploy's Traefik routes them. Services talk to each other over the internal
# `naran` network by service name (postgres, redis, meilisearch, medusa, api).
name: naran

x-restart: &restart
  restart: unless-stopped

# Shared Medusa environment — used by the migrate job, the server and the worker
# so all three see identical config (defined once, before first use so the YAML
# anchor resolves).
x-medusa-env: &medusa-env
  NODE_ENV: production
  # Redis-backed event bus + workflow engine are enabled in production so the
  # server and worker share events/jobs.
  MEDUSA_WORKER_MODE: server
  DATABASE_URL: postgres://${POSTGRES_USER:-naran}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-naran}
  REDIS_URL: redis://redis:6379
  MEILISEARCH_HOST: http://meilisearch:7700
  MEILISEARCH_API_KEY: ${MEILISEARCH_API_KEY}
  JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in infra/.env}
  COOKIE_SECRET: ${COOKIE_SECRET:?set COOKIE_SECRET in infra/.env}
  # RBAC: emails that stay super-admin without a role; when set, other role-less
  # admins are denied custom admin routes (deny-by-default). Blank → no lockout.
  SUPER_ADMIN_EMAILS: ${SUPER_ADMIN_EMAILS:-}
  # Public origins allowed to call Medusa (your real domains).
  STORE_CORS: ${STORE_CORS}
  ADMIN_CORS: ${ADMIN_CORS}
  AUTH_CORS: ${AUTH_CORS}
  # Optional Cloudflare R2 / S3 image storage (leave blank → local files).
  S3_FILE_URL: ${S3_FILE_URL:-}
  S3_ENDPOINT: ${S3_ENDPOINT:-}
  S3_BUCKET: ${S3_BUCKET:-}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
  S3_REGION: ${S3_REGION:-auto}
  # Storefront base for password-reset links + transactional email (Resend).
  # Blank RESEND_API_KEY → emails log-only (mock). The worker sends these, so
  # they belong in the shared env (B7).
  STOREFRONT_URL: ${STOREFRONT_URL:-http://localhost:3000}
  # On-demand storefront revalidation (admin saves go live immediately).
  # Defaults to a value derived from COOKIE_SECRET so no extra setup is needed.
  REVALIDATE_SECRET: ${REVALIDATE_SECRET:-${COOKIE_SECRET}}
  STOREFRONT_REVALIDATE_URL: http://web:3000/api/revalidate
  # Shared with the api: only it may complete carts into orders (after payment).
  INTERNAL_API_SECRET: ${INTERNAL_API_SECRET:-${JWT_SECRET}}
  RESEND_API_KEY: ${RESEND_API_KEY:-}
  EMAIL_FROM: ${EMAIL_FROM:-NARAN <onboarding@resend.dev>}

services:
  postgres:
    image: postgres:16-alpine
    <<: *restart
    # The default max_connections=100 is not enough: Medusa keeps a pool per
    # module in EACH of migrate / server / worker. Pools are capped in
    # medusa-config.ts (DB_POOL_MAX, default 3) — ~26 modules x 3 x 3 processes
    # still needs well over 100. Raise both together if you change either.
    command: ["postgres", "-c", "max_connections=300"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-naran}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in infra/.env}
      POSTGRES_DB: ${POSTGRES_DB:-naran}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-naran} -d ${POSTGRES_DB:-naran}"]
      interval: 5s
      timeout: 5s
      retries: 20
    # Raised from 768m with max_connections: each backend needs its own memory.
    mem_limit: 1536m
    networks: [naran]

  redis:
    image: redis:7-alpine
    <<: *restart
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    mem_limit: 256m
    networks: [naran]

  meilisearch:
    image: getmeili/meilisearch:v1.53
    <<: *restart
    environment:
      MEILI_MASTER_KEY: ${MEILISEARCH_API_KEY:?set MEILISEARCH_API_KEY in infra/.env}
      MEILI_ENV: production
      MEILI_NO_ANALYTICS: "true"
    volumes:
      - meilidata:/meili_data
    mem_limit: 512m
    networks: [naran]

  # One-shot: run DB migrations exactly once, then exit. The server and worker
  # wait for this to complete, so migrations never race across replicas (H8).
  medusa-migrate:
    build:
      context: ../medusa-backend/apps/backend
    image: naran-medusa:latest
    restart: "no"
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      <<: *medusa-env
    command: ["sh", "-c", "cd .medusa/server && npx medusa db:migrate"]
    # Loads every module at once to migrate them; 768m left it thrashing for
    # ~25 min before timing out. Freed again as soon as the one-shot exits.
    mem_limit: 1536m
    networks: [naran]

  # HTTP server (admin + store/API). Migrations already ran in medusa-migrate, so
  # this only starts the server (no db:migrate here → safe to scale to replicas).
  medusa:
    image: naran-medusa:latest
    <<: *restart
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      meilisearch: { condition: service_started }
      medusa-migrate: { condition: service_completed_successfully }
    environment:
      <<: *medusa-env
    command: ["sh", "-c", "cd .medusa/server && npm run start"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    mem_limit: 1024m
    expose:
      - "9000"
    networks: [naran]

  # Background worker (subscribers, scheduled jobs — MeiliSearch indexing, emails).
  # Same image; MEDUSA_WORKER_MODE=worker. Waits for migrations, then starts.
  medusa-worker:
    image: naran-medusa:latest
    <<: *restart
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      medusa-migrate: { condition: service_completed_successfully }
    environment:
      <<: *medusa-env
      MEDUSA_WORKER_MODE: worker
    command: ["sh", "-c", "cd .medusa/server && npm run start"]
    mem_limit: 640m
    networks: [naran]

  api:
    build:
      context: ../api
    <<: *restart
    depends_on:
      medusa: { condition: service_started }
    environment:
      NODE_ENV: production
      PORT: "4000"
      JWT_SECRET: ${JWT_SECRET}
      # Authorizes cart completion on Medusa (same value as the medusa services).
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET:-${JWT_SECRET}}
      WEB_ORIGIN: ${STORE_CORS}
      # Medusa (internal service URL) + publishable key — the gateway completes orders.
      MEDUSA_URL: http://medusa:9000
      MEDUSA_PK: ${NEXT_PUBLIC_MEDUSA_PK}
      NEXT_PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-https://naran.mn}
      # Botxon (botxon.chat → QPay & bank apps) — the ACTIVE gateway. REQUIRED in
      # prod: the api refuses to boot without BOTXON_GATEWAY_KEY (blank = mock,
      # would auto-"pay"). Webhook: https://<storefront>/api/webhooks/botxon
      BOTXON_GATEWAY_URL: ${BOTXON_GATEWAY_URL:-https://botxon.chat}
      BOTXON_GATEWAY_KEY: ${BOTXON_GATEWAY_KEY:-}
      BOTXON_WEBHOOK_SECRET: ${BOTXON_WEBHOOK_SECRET:-}
      # Email (Resend).
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-NARAN <onboarding@resend.dev>}
      # Error monitoring (Sentry, optional).
      SENTRY_DSN: ${SENTRY_DSN:-}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    mem_limit: 256m
    expose:
      - "4000"
    networks: [naran]

  web:
    build:
      context: ../web
      args:
        # NEXT_PUBLIC_* are inlined at build time → must be the PUBLIC URLs the
        # browser will use (your medusa domain), not internal service names.
        NEXT_PUBLIC_MEDUSA_URL: ${NEXT_PUBLIC_MEDUSA_URL:?set NEXT_PUBLIC_MEDUSA_URL in infra/.env}
        NEXT_PUBLIC_MEDUSA_PK: ${NEXT_PUBLIC_MEDUSA_PK:?set NEXT_PUBLIC_MEDUSA_PK in infra/.env}
        NEXT_PUBLIC_MEDUSA_REGION: ${NEXT_PUBLIC_MEDUSA_REGION:?set NEXT_PUBLIC_MEDUSA_REGION in infra/.env}
        NEXT_PUBLIC_USE_MEDUSA: "1"
        NEXT_PUBLIC_MEILISEARCH: ${NEXT_PUBLIC_MEILISEARCH:-1}
        NEXT_PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-https://naran.mn}
        NEXT_PUBLIC_GA_ID: ${NEXT_PUBLIC_GA_ID:-}
        NEXT_PUBLIC_META_PIXEL_ID: ${NEXT_PUBLIC_META_PIXEL_ID:-}
        NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
        # R2 image host → next/image remotePatterns (baked in at build time).
        S3_FILE_URL: ${S3_FILE_URL:-}
        # /api/* rewrite target — frozen into the build, must be the internal gateway.
        API_URL: http://api:4000
    <<: *restart
    depends_on:
      medusa: { condition: service_started }
      api: { condition: service_started }
    environment:
      # Runtime: the storefront proxies /api/* to the Express gateway.
      API_URL: http://api:4000
      # Shared with Medusa: authorizes /api/revalidate calls from the backend.
      REVALIDATE_SECRET: ${REVALIDATE_SECRET:-${COOKIE_SECRET}}
      # Needed at RUNTIME by next.config headers() to allowlist the Medusa origin
      # in the CSP connect-src (the browser calls Medusa directly). Without it the
      # enforced CSP would block store API calls in production.
      NEXT_PUBLIC_MEDUSA_URL: ${NEXT_PUBLIC_MEDUSA_URL:?set NEXT_PUBLIC_MEDUSA_URL in infra/.env}
    healthcheck:
      # 127.0.0.1, not localhost: in this alpine image localhost resolves to ::1
      # first, but Next (HOSTNAME=0.0.0.0) listens on IPv4 only — so a localhost
      # probe is always refused, the container stays unhealthy, and Traefik never
      # routes the storefront domain.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ >/dev/null 2>&1 || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 40s
    mem_limit: 512m
    expose:
      - "3000"
    networks: [naran]

volumes:
  pgdata:
  redisdata:
  meilidata:

networks:
  naran:
    driver: bridge
