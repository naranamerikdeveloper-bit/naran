name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  storefront-api:
    name: Storefront + API (typecheck, lint, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install (root workspaces)
        run: npm install
      - name: Typecheck (api)
        run: npm --workspace api run typecheck
      - name: Typecheck (storefront)
        run: npm --workspace web run typecheck
      - name: Lint (storefront)
        run: npm --workspace web run lint
      - name: Build API (Express)
        run: npm --workspace api run build
      - name: Build storefront (Next.js)
        run: npm --workspace web run build
        env:
          NEXT_PUBLIC_USE_MEDUSA: "1"
          NEXT_PUBLIC_MEDUSA_URL: https://example.invalid
          NEXT_PUBLIC_MEDUSA_PK: pk_ci_placeholder
          NEXT_PUBLIC_MEDUSA_REGION: reg_ci_placeholder
          NEXT_PUBLIC_SITE_URL: https://naran.mn

  medusa:
    name: Medusa backend (test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: medusa-backend/apps/backend
    services:
      # Matches medusa-backend/apps/backend/.env.test (localhost:5433, naran/naran).
      # Port mapped to 5433 so the same test env works locally and in CI. The
      # POSTGRES_USER is a superuser, so pg-god can create per-run test DBs.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: naran
          POSTGRES_PASSWORD: naran
          POSTGRES_DB: naran_store
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install (medusa)
        run: npm install --legacy-peer-deps
      - name: Unit tests (medusa)
        run: npm run test:unit
      - name: Integration tests (medusa, real DB)
        run: npm run test:integration:http
      - name: Build (medusa)
        run: npm run build
